    <script>
      //ab userdashboard pe aa chuka hai to aate vkt humne usse token to diya hi hai ab har 
      //subsequent request pe hum check krskte hai ki uska token valid hai ya nhi
      //agr req shi hai to usko uss page ka html bhejdo

      let url = "https://journizz.onrender.com"

      document.addEventListener("DOMContentLoaded",getname())

      async function getname() {

        try{
          const response = await fetch(`${url}/getname`,{
            method: "GET",
            headers: {
              "Content-Type": "application/json",
              "authorization": localStorage.getItem("token")
            }

          })

        let today = new Date();
        let dd = String(today.getDate()).padStart(2, '0');
        let mm = String(today.getMonth() + 1).padStart(2, '0'); //January is 0!
        let hours = String(today.getHours());
        let minute = String(today.getMinutes());
        let yyyy = today.getFullYear();
          const data = await response.json()

          let todaydate = dd + '/' + mm + '/' + yyyy;
          let timenow = hours + ":" + minute;

          console.log(timenow);
          
          const name = document.getElementById("name")
          const name2 = document.getElementById("name2")
          name.innerHTML = data.name + "!"
          name2.innerHTML = data.name

          const username = document.getElementById("username")
          username.innerHTML = data.username

          const time = document.getElementById("greetingtime")
          console.log(timenow)
          console.log(todaydate);
          
          time.innerHTML = timenow
          
        }
        catch(e){
          console.log("Internal server error");
          alert("Some error occured");
        }
        
      }

      async function validatetoalljournals(){
        try{
          const response = await fetch(`${url}/validate`,{
            method: "GET",
            headers: {
              "Content-Type": "application/json",
              "authorization": localStorage.getItem("token")
            }

          })
          const data = await response.json()

          if(data.message === "Verified"){
            window.location.href = "/alljournals.html"
          }
        }
        catch(e){
          alert("Could not process your journals")
          console.log(e)
        }
      }


      //get suggestion function
       let usercontent = "hello"

      async function getsuggestions(){
        let usercontentbox = document.getElementById("userjournalinput")

        let putsuggestion = document.getElementById("putsuggestion")

        //mai soch rha tha in get elemnt pe bhi await kyu nhi lgate par ye to sync operations hai na inhe background mai thodi krenge 
        usercontent = usercontentbox.value

        try{
          const response = await fetch(`${url}/getsuggestion`,{
            method: "POST",
            headers: {
              "Content-Type": "application/json"
            },
            body: JSON.stringify({
              content: usercontent
            })
          })
          //yha pe await lgana bhul gya tha ye toh ek async procees hai to await lgao 
          const data = await response.json()
          console.log(data)

          let suggestion = data.content
          console.log(suggestion)
          putsuggestion.value = suggestion

        }
        catch(e){
          console.log("Some error occures")
          console.log(e.message)
        }
      }

      async function logout(){


        localStorage.removeItem("token");

        window.location.href = "/login.html"

        
      }

      async function addjournal() {

        const description = document.getElementById("userjournalinput").value
        let today = new Date();
        let dd = String(today.getDate()).padStart(2, '0');
        let mm = String(today.getMonth() + 1).padStart(2, '0'); //January is 0!
        let yyyy = today.getFullYear();

        let todaydate = dd + '/' + mm + '/' + yyyy;
        
        try{
          const response = await fetch(`${url}/addjournal`,{
            method: "POST",
            headers: {
              "Content-type": "application/json",
              "authorization": localStorage.getItem("token")              
            },
            body: JSON.stringify({
              description: description,
              bookamrk: false,
              date: todaydate
            })

          })
        }
        catch(e){

        }
      }
